name: CI

on:
  push:
    branches: [main, production]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The Astro build type-checks the whole app, so it is the real gate here.
      # PUBLIC_API_URL only has to be a well-formed URL for the build to succeed;
      # the deployed value comes from the service variable.
      - run: pnpm build
        env:
          PUBLIC_API_URL: http://localhost:8080

      # Covers both apps: the mobile package has no build step of its own, and
      # its bundle is compiled ahead of time into the release APK, so a type
      # error that slips through becomes a crash on a phone rather than a red
      # box in a dev client.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # The release workflow runs the same bundler. Doing it here means a
      # broken import is caught on the PR rather than 12 minutes into a
      # production build.
      - name: Bundle the mobile app
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/expo-export"

  # The API is the contract of record, and it lives in another repository with no
  # compiler between us and it. This fails the build when its endpoint reference
  # changes, so a breaking change is noticed here rather than at runtime.
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare against autonex-crm-api docs/API.md
        env:
          GH_TOKEN: ${{ secrets.API_REPO_READ_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "API_REPO_READ_TOKEN not set — skipping contract check."
            echo "Add a read-only token for Autonex009/autonex-crm-api to enable it."
            exit 0
          fi
          gh api -H 'Accept: application/vnd.github.raw' \
            repos/Autonex009/autonex-crm-api/contents/docs/API.md > /tmp/API.md
          if ! diff -q /tmp/API.md docs/api-contract/API.md >/dev/null 2>&1; then
            echo "::error::The API reference changed in autonex-crm-api."
            diff -u docs/api-contract/API.md /tmp/API.md || true
            echo "Review the diff, update packages/types if needed, then copy the"
            echo "new file to docs/api-contract/API.md to acknowledge it."
            exit 1
          fi
          echo "API contract unchanged."
